<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Busca de Leads — Vitrine Delivery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0b1e;
      --bg-soft: #16132e;
      --card: #1c1838;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f2ff;
      --muted: #a9a4c9;
      --brand: #ff6b35;
      --brand-2: #ffb347;
      --accent: #7c5cff;
      --green: #2ecc71;
      --red: #ff4d6d;
      --ifood: #ea1d2c;
      --dm: #ff8a00;
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    a { color: var(--brand-2); }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; }
    h1 span { background: linear-gradient(90deg, var(--brand), var(--brand-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { color: var(--muted); font-size: .92rem; }

    form.search { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px;
      grid-template-columns: 2fr 80px 2fr auto; align-items: end; }
    label { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); font-weight: 600; }
    input, select, textarea { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; width: 100%; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .opts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: .88rem; color: var(--muted); }
    .opts label { display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: .88rem; }
    .opts input[type=checkbox] { width: auto; accent-color: var(--brand); }
    .opts input[type=number] { width: 70px; padding: 6px 8px; }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 11px 18px; cursor: pointer; color: #fff;
      background: linear-gradient(90deg, var(--brand), var(--brand-2)); }
    button.ghost { background: var(--card); border: 1px solid var(--border); color: var(--text); font-weight: 600; }
    button:disabled { opacity: .6; cursor: progress; }

    .status { margin: 16px 0; font-size: .9rem; color: var(--muted); min-height: 1.4em; }
    .error { background: rgba(255, 77, 109, .1); border: 1px solid rgba(255, 77, 109, .4); color: #ffb3c1; padding: 10px 12px; border-radius: 10px; margin: 8px 0; font-size: .88rem; }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    .stat { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .stat b { display: block; font-size: 1.5rem; }
    .stat small { color: var(--muted); }

    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    .toolbar input, .toolbar select { width: auto; flex: 1 1 180px; }

    .list { display: grid; gap: 12px; }
    .lead { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: grid; grid-template-columns: 64px 1fr 220px; gap: 16px; }
    .score { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 1.2rem;
      background: conic-gradient(var(--c) calc(var(--p) * 1%), rgba(255,255,255,.06) 0); position: relative; }
    .score::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: var(--card); }
    .score span { position: relative; z-index: 1; }
    .lead h3 { font-size: 1.05rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .meta { color: var(--muted); font-size: .85rem; margin: 2px 0 8px; }
    .badge { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; color: #fff; text-decoration: none; }
    .badge.ifood { background: var(--ifood); }
    .badge.deliverymuch { background: var(--dm); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: .75rem; padding: 3px 9px; border-radius: 99px; background: rgba(124, 92, 255, .15); color: #cfc3ff; }
    .side { display: grid; gap: 8px; align-content: start; }
    .side textarea { min-height: 54px; font-size: .82rem; resize: vertical; }
    .side .actions { display: flex; gap: 8px; }
    .side .actions a { flex: 1; text-align: center; font-size: .82rem; font-weight: 700; padding: 8px; border-radius: 10px; text-decoration: none; }
    .wa { background: var(--green); color: #062b14; }
    .copy { background: var(--bg-soft); border: 1px solid var(--border); color: var(--text) !important; cursor: pointer; }
    .empty { text-align: center; color: var(--muted); padding: 48px 16px; border: 1px dashed var(--border); border-radius: var(--radius); }

    @media (max-width: 860px) {
      form.search { grid-template-columns: 1fr 80px; }
      form.search .term { grid-column: 1 / -1; }
      form.search button { grid-column: 1 / -1; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .lead { grid-template-columns: 56px 1fr; }
      .score { width: 56px; height: 56px; }
      .side { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Busca de Leads <span>Vitrine Delivery</span></h1>
        <p class="sub">Encontre lojas no iFood e na Delivery Much com vitrine fraca — os melhores leads para prospectar.</p>
      </div>
    </header>

    <form class="search" id="form">
      <label>Cidade <input name="city" value="Feira de Santana" required /></label>
      <label>UF <input name="uf" value="BA" maxlength="2" required /></label>
      <label class="term">Termo (opcional) <input name="term" placeholder="hambúrguer, pizza, açaí…" /></label>
      <button type="submit" id="btn">Buscar leads</button>
      <div class="opts">
        <label><input type="checkbox" name="src" value="ifood" checked /> iFood</label>
        <label><input type="checkbox" name="src" value="deliverymuch" checked /> Delivery Much</label>
        <label title="Lê o cardápio de cada loja para medir fotos e descrições (mais lento)"><input type="checkbox" name="enrich" checked /> Analisar cardápio</label>
        <label>Score mínimo <input type="number" name="minScore" value="0" min="0" max="100" /></label>
        <label title="Usa dados fictícios, sem acessar as plataformas"><input type="checkbox" name="demo" /> Modo demonstração</label>
      </div>
    </form>

    <div class="status" id="status"></div>
    <div id="errors"></div>

    <section id="results" hidden>
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <input id="filter" placeholder="Filtrar por nome, categoria ou motivo…" />
        <select id="statusFilter">
          <option value="">Todos os status</option>
        </select>
        <select id="platformFilter">
          <option value="">Todas as plataformas</option>
          <option value="ifood">Só iFood</option>
          <option value="deliverymuch">Só Delivery Much</option>
          <option value="both">Nas duas</option>
        </select>
        <button class="ghost" id="exportBtn" type="button">Exportar CSV</button>
      </div>
      <div class="list" id="list"></div>
    </section>
  </div>

  <script>
    const STATUSES = ['Novo', 'Contatado', 'Em negociação', 'Fechado', 'Descartado'];
    const PLATFORM_LABEL = { ifood: 'iFood', deliverymuch: 'Delivery Much' };
    const STORE_KEY = 'vd-leads-crm';

    let leads = [];
    let crm = loadCrm();

    function loadCrm() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
    }
    function saveCrm() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(crm)); } catch { /* armazenamento indisponível */ }
    }
    const keyOf = (l) => `${l.platforms.join('+')}:${l.name.toLowerCase()}`;
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const $ = (id) => document.getElementById(id);
    for (const s of STATUSES) $('statusFilter').insertAdjacentHTML('beforeend', `<option>${s}</option>`);

    function pitch(l) {
      const motivo = l.reasons.slice(0, 2).join(' e ').toLowerCase();
      return `Olá, ${l.name}! Tudo bem? Sou da Vitrine Delivery, aqui de ${l.city}. ` +
        `Dei uma olhada na loja de vocês no ${l.platforms.map((p) => PLATFORM_LABEL[p]).join(' e ')} ` +
        (motivo ? `e vi algumas oportunidades (${motivo}). ` : '') +
        `Ajudamos deliveries a vender mais com fotos, descrições e cardápio otimizados. Posso te mandar uma amostra gratuita?`;
    }

    function phoneDigits(p) {
      let d = String(p || '').replace(/\D/g, '');
      if (!d) return null;
      if (!d.startsWith('55')) d = '55' + d;
      return d.length >= 12 ? d : null;
    }

    function scoreColor(s) {
      return s >= 60 ? 'var(--green)' : s >= 35 ? 'var(--brand-2)' : 'var(--muted)';
    }

    function render() {
      const text = $('filter').value.toLowerCase();
      const st = $('statusFilter').value;
      const pf = $('platformFilter').value;
      const shown = leads.filter((l) => {
        const c = crm[keyOf(l)] || {};
        if (st && (c.status || 'Novo') !== st) return false;
        if (pf === 'both' && l.platforms.length < 2) return false;
        if (pf && pf !== 'both' && !(l.platforms.length === 1 && l.platforms[0] === pf)) return false;
        if (text && !`${l.name} ${l.category} ${l.reasons.join(' ')}`.toLowerCase().includes(text)) return false;
        return true;
      });

      $('list').innerHTML = shown.length ? shown.map((l, i) => {
        const k = keyOf(l);
        const c = crm[k] || {};
        const phone = phoneDigits(l.phone);
        const badges = l.platforms.map((p) => l.urls[p]
          ? `<a class="badge ${p}" href="${esc(l.urls[p])}" target="_blank" rel="noopener">${PLATFORM_LABEL[p]} ↗</a>`
          : `<span class="badge ${p}">${PLATFORM_LABEL[p]}</span>`).join('');
        const meta = [
          l.category,
          l.rating ? `★ ${l.rating.toFixed(1)}${l.reviewCount ? ` (${l.reviewCount})` : ''}` : null,
          l.menu ? `${l.menu.withPhoto}/${l.menu.items} itens com foto` : null,
          l.phone ? `☎ ${l.phone}` : null,
          l.address,
          l.cnpj ? `CNPJ ${l.cnpj}` : null,
        ].filter(Boolean).map(esc).join(' · ');
        return `
          <article class="lead">
            <div class="score" style="--p:${l.score};--c:${scoreColor(l.score)}" title="Score de oportunidade"><span>${l.score}</span></div>
            <div>
              <h3>${esc(l.name)} ${badges}</h3>
              <p class="meta">${meta || '&nbsp;'}</p>
              <div class="chips">${l.reasons.map((r) => `<span class="chip">${esc(r)}</span>`).join('')}</div>
            </div>
            <div class="side">
              <select data-k="${esc(k)}" data-f="status">${STATUSES.map((s) => `<option ${s === (c.status || 'Novo') ? 'selected' : ''}>${s}</option>`).join('')}</select>
              <textarea data-k="${esc(k)}" data-f="note" placeholder="Anotações…">${esc(c.note)}</textarea>
              <div class="actions">
                ${phone ? `<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${phone}?text=${encodeURIComponent(pitch(l))}">WhatsApp</a>` : ''}
                <a class="copy" data-copy="${i}">Copiar abordagem</a>
              </div>
            </div>
          </article>`;
      }).join('') : '<div class="empty">Nenhum lead com esses filtros.</div>';

      $('list').querySelectorAll('[data-copy]').forEach((el) => {
        el.onclick = async () => {
          try { await navigator.clipboard.writeText(pitch(shown[el.dataset.copy])); el.textContent = 'Copiado!'; }
          catch { el.textContent = 'Não foi possível copiar'; }
          setTimeout(() => (el.textContent = 'Copiar abordagem'), 1500);
        };
      });
    }

    $('list').addEventListener('change', (e) => {
      const { k, f } = e.target.dataset;
      if (!k) return;
      crm[k] = { ...(crm[k] || {}), [f]: e.target.value };
      saveCrm();
    });
    ['filter', 'statusFilter', 'platformFilter'].forEach((id) => $(id).addEventListener('input', render));

    function renderStats(data) {
      const hot = leads.filter((l) => l.score >= 60).length;
      const both = leads.filter((l) => l.platforms.length > 1).length;
      const withPhone = leads.filter((l) => phoneDigits(l.phone)).length;
      $('stats').innerHTML = [
        [leads.length, 'lojas encontradas'],
        [hot, 'leads quentes (score ≥ 60)'],
        [both, 'nas duas plataformas'],
        [withPhone, 'com telefone'],
      ].map(([n, t]) => `<div class="stat"><b>${n}</b><small>${t}</small></div>`).join('');
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const sources = f.getAll('src');
      if (!sources.length) { $('status').textContent = 'Escolha pelo menos uma plataforma.'; return; }
      const params = new URLSearchParams({
        city: f.get('city'), uf: f.get('uf'), term: f.get('term'),
        sources: sources.join(','), minScore: f.get('minScore') || 0,
        enrich: f.get('enrich') ? '1' : '0', demo: f.get('demo') ? '1' : '0',
      });
      $('btn').disabled = true;
      $('status').textContent = 'Buscando lojas… (com análise de cardápio pode levar até 1 minuto)';
      $('errors').innerHTML = '';
      try {
        const res = await fetch(`/api/search?${params}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Falha na busca');
        leads = data.leads;
        $('errors').innerHTML = Object.entries(data.errors || {})
          .map(([p, m]) => `<div class="error"><b>${PLATFORM_LABEL[p] || esc(p)}:</b> ${esc(m)}</div>`).join('');
        $('status').textContent = `${data.total} leads em ${data.location.city}/${data.location.uf}, ordenados por oportunidade.`;
        $('results').hidden = false;
        renderStats(data);
        render();
      } catch (err) {
        $('status').textContent = '';
        $('errors').innerHTML = `<div class="error">${esc(err.message)}</div>`;
      } finally {
        $('btn').disabled = false;
      }
    });

    $('exportBtn').addEventListener('click', () => {
      const cols = ['score', 'nome', 'categoria', 'plataformas', 'nota', 'avaliacoes', 'itens', 'itens_com_foto', 'telefone', 'endereco', 'cnpj', 'link_ifood', 'link_deliverymuch', 'motivos', 'status', 'anotacoes'];
      const rows = leads.map((l) => {
        const c = crm[keyOf(l)] || {};
        return [l.score, l.name, l.category, l.platforms.map((p) => PLATFORM_LABEL[p]).join(' + '), l.rating, l.reviewCount,
          l.menu?.items, l.menu?.withPhoto, l.phone, l.address, l.cnpj, l.urls.ifood, l.urls.deliverymuch,
          l.reasons.join('; '), c.status || 'Novo', c.note];
      });
      const csv = [cols, ...rows].map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
      a.download = `leads-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    });
  </script>
</body>
</html>
